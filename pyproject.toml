[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quickbooks-excel-cash-flow-automation"
version = "1.0.0"
description = "Fills a firm's existing Excel cash flow template from QuickBooks Online without touching its formulas, then proves the numbers before release."
readme = "README.md"
license = "MIT"
authors = [{ name = "Alex Kurinets" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "lxml>=5.2",
    "openpyxl>=3.1",
    "formulas>=1.2.8",
    "httpx>=0.27",
    "openai>=1.60,<3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40", "requests>=2.32", "pandas>=2.2"]
dev = ["pytest>=8", "ruff>=0.6", "xlsxwriter>=3.2", "streamlit>=1.40", "requests>=2.32", "pandas>=2.2"]

[project.scripts]
cashflow = "cashflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cashflow", "conftest", "common", "build_template"]

[tool.ruff.lint.per-file-ignores]
"src/cashflow/synthetic.py" = ["E501"]  # the synthetic clients are defined as wide data tables
